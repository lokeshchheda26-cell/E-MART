<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <title>E-Mart — Everyday low prices on groceries, electronics &amp; more</title>
    <meta
      name="description"
      content="Shop groceries, electronics, beverages and daily essentials at E-Mart. Free delivery over Rs.499, secure payments, and e-Mcard rewards on every eligible order."
    />
    <!-- Matches the brand indigo, so the mobile browser chrome and the
         address bar tint with the site rather than against it. -->
    <meta name="theme-color" content="#4f46e5" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b1120" media="(prefers-color-scheme: dark)" />

    <!-- Warm up the font connection before the CSS that requests it is
         parsed - saves a round trip on the first paint of the header. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Bootstrap is still used for a handful of layout utilities and its
         icon font. Its CSS variables are re-pointed at the design tokens in
         src/styles/tokens.css, so stock Bootstrap components inherit the
         E-Mart palette instead of looking like a default template.
         NOTE: the Bootstrap JS bundle is no longer loaded - the dropdown,
         collapse and modal behaviours it used to provide are now handled by
         the app's own components, so it was dead weight on every page. -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
